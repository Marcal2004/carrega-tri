<title>Càrrega Tri</title>
<meta name="claude:viewport-fit-sides" content="cover">

<style>
/* Layout: one-column phone app, dark training-log look, fixed bottom tab bar, bottom sheets for every edit */
:root{
  --bg:#050607; --card:#111316; --card2:#181B1F; --line:#24282E; --fg:#F2F4F5; --mut:#8B939C; --mut2:#5C636B;
  --brand:#FFD400; --on-brand:#0A0A0A; --green:#18D67A; --yellow:#FF9F1C; --red:#FF3B4E; --blue:#5B9BFF;
  --nat:#33C3F0; --bici:#4C8DFF; --cursa:#FF4F8B; --forca:#A18BFF;
  --disp:"Barlow Condensed","Arial Narrow",system-ui,sans-serif; --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--body);font-size:15px;line-height:1.4;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px calc(96px + env(safe-area-inset-bottom,0px))}
.top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:14px}
.eyebrow{font-family:var(--disp);font-weight:600;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--mut)}
h1{font-family:var(--disp);font-weight:700;font-size:30px;line-height:1;margin:4px 0 0;letter-spacing:.01em;text-wrap:balance}
h2{font-family:var(--disp);font-weight:700;font-size:20px;letter-spacing:.06em;text-transform:uppercase;margin:22px 0 10px}
.card{background:var(--card);border-radius:14px;padding:16px}
.stack{display:flex;flex-direction:column;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{background:var(--card);border-radius:14px;padding:12px;min-width:0}
.tile .lab{font-family:var(--disp);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--mut)}
.tile .val{font-family:var(--disp);font-weight:700;font-size:30px;line-height:1.05;font-variant-numeric:tabular-nums;margin-top:4px}
.tile .sub{font-size:12px;color:var(--mut);margin-top:2px}
.num{font-variant-numeric:tabular-nums}
.mut{color:var(--mut)} .small{font-size:13px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:12px;padding:12px 16px;font-family:var(--disp);font-weight:700;font-size:16px;letter-spacing:.08em;text-transform:uppercase;background:var(--card2);color:var(--fg)}
.btn.pri{background:var(--brand);color:var(--on-brand)}
.btn.ghost{background:transparent;border:1px solid var(--line)}
.btn.danger{background:transparent;color:var(--red);border:1px solid #4a1d24}
.btn.block{width:100%}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:600;background:var(--card2);color:var(--mut);white-space:nowrap}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
/* recovery ring */
.hero{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;align-items:center}
.ring{position:relative;width:96px;height:96px}
.ring svg{width:96px;height:96px;transform:rotate(-90deg)}
.ring .in{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .pct{font-family:var(--disp);font-weight:700;font-size:28px;line-height:1;font-variant-numeric:tabular-nums}
.ring .cap{font-family:var(--disp);font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--mut)}
.decision{font-family:var(--disp);font-weight:700;font-size:20px;line-height:1.05;text-transform:uppercase;letter-spacing:.03em}
.kv{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--mut);padding:3px 0}
.kv b{color:var(--fg);font-weight:600}
/* sessions list */
.sess{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:12px;padding:11px 12px;width:100%;text-align:left}
.sess .ic{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex:none}
.sess .t{flex:1;min-width:0}
.sess .t1{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sess .t2{display:block;font-size:12px;color:var(--mut)}
.sess .ld{font-family:var(--disp);font-weight:700;font-size:20px;font-variant-numeric:tabular-nums;text-align:right}
.sess .ld small{display:block;font-size:10px;letter-spacing:.12em;color:var(--mut);font-weight:600}
/* bars */
.bar{height:8px;background:var(--card2);border-radius:99px;overflow:hidden;position:relative}
.bar i{position:absolute;left:0;top:0;bottom:0;border-radius:99px}
.bar .mark{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--fg);border-radius:2px}
.discrow{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:10px;align-items:center;padding:7px 0}
.disclab{font-size:13px;display:flex;justify-content:space-between;margin-bottom:5px;gap:8px}
/* day rows */
.day{background:var(--card);border-radius:12px;padding:10px 12px}
.dayh{display:flex;align-items:center;justify-content:space-between;gap:8px}
.dayh .d{font-family:var(--disp);font-weight:700;font-size:17px;letter-spacing:.04em;text-transform:uppercase}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:9px;padding:6px 9px;font-size:13px;background:var(--card2)}
.chip.add{color:var(--mut);border:1px dashed var(--line);background:transparent}
.today-ring{outline:1px solid var(--brand);outline-offset:-1px}
/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(10,11,13,.96);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);align-items:center}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0 8px;font-family:var(--disp);font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--mut2)}
.tab svg{width:22px;height:22px}
.tab.on{color:var(--brand)}
.tab.plus span{width:46px;height:46px;border-radius:50%;background:var(--brand);color:var(--on-brand);display:flex;align-items:center;justify-content:center;margin-top:-6px}
.tab.plus svg{width:24px;height:24px}
.seg{display:flex;gap:6px;background:var(--card);padding:4px;border-radius:12px;overflow-x:auto}
.seg button{flex:1;padding:8px 10px;border-radius:9px;font-family:var(--disp);font-weight:700;font-size:14px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);white-space:nowrap}
.seg button.on{background:var(--card2);color:var(--fg)}
/* sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:560px;max-height:92vh;overflow-y:auto;background:#0E1013;border-radius:20px 20px 0 0;border-top:1px solid var(--line);padding:18px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet h3{font-family:var(--disp);font-weight:700;font-size:24px;text-transform:uppercase;letter-spacing:.04em;margin:0}
.field{display:flex;flex-direction:column;gap:6px;margin-top:14px}
.field>label,.flab{font-family:var(--disp);font-size:13px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--mut)}
.in-t{width:100%;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:11px 12px;font-size:16px}
.in-t:focus{border-color:var(--mut)}
.f2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.f3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.pick{display:grid;gap:6px}
.pick button{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 0;font-family:var(--disp);font-weight:700;font-size:18px;font-variant-numeric:tabular-nums}
.pick button.on{background:var(--brand);color:var(--on-brand);border-color:var(--brand)}
.disc-pick{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.disc-pick button{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 4px;display:flex;flex-direction:column;align-items:center;gap:5px;font-size:12px;font-weight:600;color:var(--mut)}
.disc-pick button svg{width:26px;height:26px}
.disc-pick button.on{color:var(--fg)}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--card);border-radius:10px;padding:10px 12px;margin-top:14px}
.sw{width:46px;height:28px;border-radius:99px;background:var(--card2);position:relative;flex:none}
.sw i{position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--mut);transition:left .15s}
.sw.on{background:var(--brand)} .sw.on i{left:21px;background:#050607}
.preview{display:flex;justify-content:space-between;align-items:baseline;background:var(--card);border-radius:12px;padding:12px;margin-top:16px}
.preview .big{font-family:var(--disp);font-weight:700;font-size:32px;font-variant-numeric:tabular-nums}
.err{color:var(--red);font-size:13px;min-height:18px;margin-top:8px}
.note{font-size:12px;color:var(--mut);margin-top:6px}
.empty{background:var(--card);border:1px dashed var(--line);border-radius:14px;padding:18px;text-align:center;color:var(--mut)}
.banner{background:#2b1d0b;color:var(--yellow);border-radius:10px;padding:9px 12px;font-size:13px;margin-bottom:12px}
.toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(14px + env(safe-area-inset-top,0px));background:var(--brand);color:var(--on-brand);border-radius:10px;padding:9px 14px;font-weight:600;z-index:60;font-size:14px}
.chartbox{position:relative;height:220px}
.wkrow{display:grid;grid-template-columns:6px 40px minmax(0,1fr) auto;gap:10px;align-items:center;background:var(--card);border-radius:12px;padding:10px 12px 10px 0;width:100%;text-align:left;overflow:hidden}
.wkrow .stripe{align-self:stretch;border-radius:0 4px 4px 0}
.wkn{font-family:var(--disp);font-weight:700;font-size:22px;text-align:center;font-variant-numeric:tabular-nums}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl td,.tbl th{padding:8px 6px;border-bottom:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums}
.tbl th{font-family:var(--disp);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);font-weight:600}
.tbl td:first-child,.tbl th:first-child{text-align:left}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:12px;color:var(--mut);margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.photo{position:relative;border-radius:16px;overflow:hidden;background:var(--card);margin-bottom:14px}
.photo img{display:block;width:100%;height:100%;object-fit:cover}
.photo.main{height:230px}.photo.main img{object-position:50% 45%}
.photo.sec{height:170px;background:var(--card)}.photo.sec img{object-fit:contain;object-position:50% 100%;padding-top:10px}
.photo .ov{position:absolute;inset:auto 0 0 0;padding:44px 16px 14px;background:linear-gradient(to top,rgba(5,6,7,.92),rgba(5,6,7,.55) 55%,rgba(5,6,7,0))}
.photo .ov h1{color:#fff}.photo .ov .eyebrow{color:var(--brand)}
.mtiles .lab{letter-spacing:.06em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.mtiles .sub{font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.plist{background:var(--card);border-radius:14px;overflow:hidden}.prow{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;text-align:left;padding:13px 16px;border-bottom:1px solid var(--line)}.prow:last-child{border-bottom:0}
.photo .tag{position:absolute;top:12px;right:12px;background:var(--brand);color:var(--on-brand);border-radius:999px;padding:4px 10px;font-family:var(--disp);font-weight:700;font-size:13px;letter-spacing:.08em;text-transform:uppercase}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

const DAY = 86400000;
const pad = n => String(n).padStart(2,"0");
const todayStr = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; };
const P = s => { const [y,m,d] = s.split("-").map(Number); return Date.UTC(y,m-1,d); };
const S = t => { const d = new Date(t); return `${d.getUTCFullYear()}-${pad(d.getUTCMonth()+1)}-${pad(d.getUTCDate())}`; };
const addD = (s,n) => S(P(s)+n*DAY);
const dow = s => (new Date(P(s)).getUTCDay()+6)%7;
const monday = s => addD(s,-dow(s));

function coefOf(s){ const c=coefs(), t=trans(); return (c[s.disc]??1) + (s.brick ? (t[s.disc]??0) : 0); }
function loadOf(s){ return s.pending||s.rpe==null ? 0 : (s.min||0)*(s.rpe||0)*coefOf(s); }
function rawOf(s){ return s.pending||s.rpe==null ? 0 : (s.min||0)*(s.rpe||0); }

function dayMaps(){
  const tot={}, byD={};
  for (const s of sessList()){ const l=loadOf(s); tot[s.date]=(tot[s.date]||0)+l; (byD[s.date] ||= {})[s.disc]=(byD[s.date][s.disc]||0)+l; }
  return {tot,byD};
}
function firstDate(){ const ds=sessList().map(s=>s.date).sort(); return ds[0]||null; }
function acuteChronic(d, tot){
  let a=0,c=0; for(let i=0;i<21;i++){ const v=tot[addD(d,-i)]||0; if(i<7)a+=v; c+=v; }
  c=c/3; const fd=firstDate();
  const acwr = (fd && diffD(d,fd)>=20 && c>0) ? a/c : null;
  return {a,c,acwr};
}
function acwrZone(x){ if(x==null) return null; if(x>1.5) return ["Pic brusc","var(--red)"]; if(x>1.3) return ["Vigilar","var(--yellow)"]; if(x>=0.8) return ["Òptima","var(--green)"]; return ["Baixa","var(--blue)"]; }
function recovery(d){
  const r = st.daily[d]; if(!r) return null;
  const q = Q_ITEMS.map(([k])=>r[k]).filter(v=>v!=null);
  const total = q.length===4 ? q.reduce((x,y)=>x+y,0) : null;
  const prev=[]; for(let i=1;i<=7;i++){ const p=st.daily[addD(d,-i)]; if(p && p.hrv!=null) prev.push(p.hrv); }
  const mean = prev.length ? prev.reduce((x,y)=>x+y,0)/prev.length : null;
  const dev = (r.hrv!=null && mean) ? r.hrv/mean-1 : null;
  let hrvState = dev==null ? null : dev<-0.10 ? "Molt baixa" : dev<-0.05 ? "Baixa" : "Normal";
  const rg=hrvRange(), a7=hrv7(d); let hp=null;
  if(rg && a7!=null){ hrvState = a7 < rg.lo-(rg.hi-rg.lo)/2 ? "Molt baixa" : a7 < rg.lo ? "Baixa" : "Normal"; hp=Math.max(0,Math.min(100,50+(a7-rg.lo)/(rg.hi-rg.lo)*50)); }
  const qState = total==null ? null : (total<=11 || Math.min(...q)===1) ? "Mala" : total<=15 ? "Parcial" : "Bona";
  const rh=rhrOf(d), rb=rhrBase(d), rdf=(rh!=null&&rb!=null)?rh-rb:null;
  const rhrState = rdf==null ? null : rdf>8 ? "Molt alta" : rdf>5 ? "Alta" : "Normal";
  let decision=null, color="var(--mut)";
  if (hrvState||qState||rhrState){
    if (hrvState==="Molt baixa"||qState==="Mala"||rhrState==="Molt alta"){ decision="Reduir o descansar"; color="var(--red)"; }
    else if (hrvState==="Baixa"||qState==="Parcial"||rhrState==="Alta"){ decision="Precaució"; color="var(--yellow)"; }
    else { decision="Entrena normal"; color="var(--green)"; }
  }
  let pct=null;
  const comps=[];
  if (total!=null) comps.push((total-4)/16*100);
  if (hp!=null) comps.push(hp); else if (dev!=null) comps.push(Math.max(0,Math.min(100,50+dev*500)));
  const rp = rdf==null ? null : Math.max(0,Math.min(100,70-rdf*7));
  if (rp!=null) comps.push(rp);
  if (total!=null && comps.length) pct=Math.round(comps.reduce((a,b)=>a+b,0)/comps.length);
  return {r,total,mean,dev,hrvState,qState,rhrState,rdf,decision,color,pct,hp};
}
function macroFor(d){
  const list=macroList();
  for(let i=0;i<list.length;i++){ const m=list[i]; if(isDate(m.start)&&isDate(m.end)&&d>=m.start&&d<=m.end) return m; }
  return null;
}

function planned(ws){
  const p=st.plan[ws]; if(!p) return null; const c=coefs(); let L=0,H=0,any=false;
  for(const d of DISC){ const h=num(p.h?.[DKEY[d]]), r=num(p.rpe?.[DKEY[d]]); if(h!=null){ any=true; H+=h; if(r!=null) L+=h*60*r*(c[d]??1); } }
  return any?{load:L,hours:H,p}:{load:null,hours:null,p};
}
function distTxt(d,wr,pl){
  if(d==="Força") return "";

function weekReal(ws){
  const out={load:0,raw:0,min:0,byD:{},minD:{},kmD:{},mSwim:0}; const we=addD(ws,6);
  for(const s of sessList()){ if(s.date<ws||s.date>we) continue; const l=loadOf(s); out.load+=l; out.raw+=rawOf(s); out.min+=s.min||0; out.byD[s.disc]=(out.byD[s.disc]||0)+l; out.minD[s.disc]=(out.minD[s.disc]||0)+(s.min||0); if(s.disc==="Natació"){ const m=num(s.m); if(m) out.mSwim=(out.mSwim||0)+m; } else if(s.disc!=="Força"){ const k=num(s.km); if(k) out.kmD[s.disc]=(out.kmD[s.disc]||0)+k; } }
  return out;
}

let syncing=false; const mcp=true;
function mapType(t){ t=String(t||"").toUpperCase(); if(/SWIM/.test(t)) return "Natació"; if(/RUN|TREADMILL|TRAIL/.test(t)) return "Carrera"; if(/BIK|CYCL|RIDE|SPIN|GRAVEL/.test(t)) return "Ciclisme"; if(/STRENGTH|WEIGHT|GYM|HIIT/.test(t)) return "Força"; return null; }
function localDate(iso){ const d=new Date(iso); return isNaN(d) ? null : `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
const numOr=(v)=>typeof v==="number"&&isFinite(v)?v:null;
async function syncGarmin(manual){
  if(syncing || !sb || st.mode!=="db" || st.viewUid) return;
  syncing=true; st.garmin={...st.garmin,state:"sync",msg:""}; schedule();
  const today=todayStr(), from=addD(today,-14);
  try{
    const {data,error}=await sb.functions.invoke("intervals-sync",{body:{oldest:from,newest:today}});
    if(error){
      let m="No s'ha pogut connectar amb intervals.icu.";
      try{ const b=await error.context.json(); if(b.error==="forbidden") m="Aquest compte no pot sincronitzar (revisa OWNER_EMAIL)."; else if(b.error==="nolink") m="Garmin encara no està connectat. Demana-ho al teu entrenador."; else if(b.error==="nokey") m="Falta la clau d'intervals.icu als Secrets de Supabase."; else if(/intervals 40[13]/.test(b.error||"")) m="intervals.icu no accepta la clau. Revisa INTERVALS_API_KEY."; }catch(_){ if(error.name==="FunctionsFetchError"||error.name==="FunctionsRelayError") m="La funció intervals-sync no està instal·lada a Supabase."; }
      throw new Error(m);
    }
    const ignored=new Set(prof().garminIgnored||[]);
    const acts=(data.activities||[]).map(a=>({...a,disc:mapType(a.type),gid:String(a.external_id||a.id||""),t0:new Date(a.start_date||a.start_date_local).getTime(),sec:a.moving_time||a.elapsed_time||0})).filter(a=>a.gid&&a.start_date_local).sort((a,b)=>a.t0-b.t0);
    let added=0, skipped=0;
    for(const a of acts){
      if(!a.disc){ skipped++; continue; }
      const id="g-"+a.gid.replace(/[^A-Za-z0-9_-]/g,"");
      if(st.sessions[id] || ignored.has(a.gid)) continue;
      const date=String(a.start_date_local).slice(0,10); if(!isDate(date)) continue;
      const min=Math.max(1,Math.round(a.sec/60));
      // ja existeix una sessió igual (p. ex. importada abans des de Claude)?
      const dup=sessList().some(s=>s.date===date && s.disc===a.disc && s.min && Math.abs(s.min-min)/Math.max(s.min,min)<0.08 && (!(s.km&&a.distance)||Math.abs(s.km*1000-a.distance)/a.distance<0.05) && (!(s.m&&a.distance)||Math.abs(s.m-a.distance)/a.distance<0.05));
      if(dup) continue;
      const s={date,disc:a.disc,min,rpe:null,pending:true,source:"garmin",gid:a.gid,iid:a.id?String(a.id):undefined,start:a.start_date||a.start_date_local,desc:a.name||a.disc,brick:false};
      if(a.disc==="Natació" && a.distance) s.m=Math.round(a.distance);
      if((a.disc==="Ciclisme"||a.disc==="Carrera") && a.distance) s.km=Math.round(a.distance/100)/10;
      if(a.average_heartrate && a.disc!=="Natació") s.fc=Math.round(a.average_heartrate);
      if(a.disc==="Ciclisme" && a.icu_average_watts) s.w=Math.round(a.icu_average_watts);
      if(a.disc==="Carrera") s.brick=acts.some(b=>b.disc==="Ciclisme" && Math.abs(a.t0-(b.t0+(b.elapsed_time||b.sec)*1000))<20*60000);
      await write("sessions",id,s); added++;
    }
    let wn=0, lastHrv=null;
    for(const r of (data.wellness||[])){
      const d=String(r.id||"").slice(0,10); if(!isDate(d)) continue;
      const g={};
      let hv=numOr(r.hrv); if(hv==null) for(const [k,v] of Object.entries(r)) if(/hrv|rmssd/i.test(k) && !/sdnn/i.test(k) && numOr(v)!=null){ hv=v; break; }
      if(hv!=null){ g.hrvG=Math.round(hv); if(!lastHrv||d>lastHrv) lastHrv=d; }
      if(numOr(r.sleepScore)!=null) g.sleepScore=Math.round(r.sleepScore);
      if(numOr(r.sleepSecs)!=null) g.sleepH=Math.round(r.sleepSecs/360)/10;
      if(numOr(r.restingHR)!=null) g.rhr=r.restingHR;
      for(const [k,v] of Object.entries(r)) if(/battery/i.test(k) && numOr(v)!=null){ g.bbHigh=Math.round(v); break; }
      if(Object.keys(g).length){
        const ex=st.daily[d]||{}, cur=ex.garmin||{};
        const nd={...ex,garmin:{...cur,...g}}; if(g.hrvG!=null && (ex.hrv==null || ex.hrvSrc==="garmin")){ nd.hrv=g.hrvG; nd.hrvSrc="garmin"; }
        if(JSON.stringify(nd)!==JSON.stringify(ex)){ await write("daily",d,nd); wn++; }
      }
      if(numOr(r.weight)!=null && !st.weights[d]) await write("weights",d,{kg:Math.round(r.weight*10)/10,note:"Garmin"});
    }
    st.garmin={state:"ok",msg:"",last:new Date(),added,skipped,wellness:wn>0,nAct:acts.length,nWell:(data.wellness||[]).length,lastHrv};
    if(manual||added) toast(added?`${added} activitat${added>1?"s noves":" nova"} de Garmin`:"Tot al dia amb Garmin");
  }catch(e){
    st.garmin={...st.garmin,state:"error",msg:e.message||"Error de sincronització"};
    if(manual) toast(st.garmin.msg);
  }finally{ syncing=false; schedule(); }
}

function hrvRange(){ const pl=num(prof().hrvLo), ph=num(prof().hrvHi); return pl!=null&&ph!=null&&ph>pl?{lo:pl,hi:ph}:null; }
function hrvOf(x){ const dd=st.daily[x]; const h=dd?(dd.hrv??dd.garmin?.hrvG??null):null; return h!=null&&isFinite(h)?Number(h):null; }
function hrv7(d){ const v=[]; for(let i=0;i<7;i++){ const h=hrvOf(addD(d,-i)); if(h!=null) v.push(h); } return v.length>=3?v.reduce((a,b)=>a+b,0)/v.length:null; }
function hrvBase(d){
  const pl=num(prof().hrvLo), ph=num(prof().hrvHi);
  if(pl!=null&&ph!=null&&ph>pl) return {m:(pl+ph)/2, sd:ph-pl, lo:pl, hi:ph, manual:true};
  const v=[]; for(let i=1;i<=7;i++){ const x=addD(d,-i), dd=st.daily[x]; const h=dd?(dd.hrv??dd.garmin?.hrvG??null):null; if(h!=null&&isFinite(h)) v.push(Number(h)); }
  if(v.length<3) return null;
  const m=v.reduce((a,b)=>a+b,0)/v.length, sd=Math.sqrt(v.reduce((a,b)=>a+(b-m)**2,0)/(v.length-1));
  const half=Math.max(sd*0.5, m*0.03);
  return {m, sd:Math.max(sd,m*0.05), lo:Math.round(m-half), hi:Math.round(m+half), n:v.length};
}

const MON_N=["gener","febrer","març","abril","maig","juny","juliol","agost","setembre","octubre","novembre","desembre"];
const PRIO_COL={A:"var(--red)",B:"var(--yellow)",C:"var(--blue)"};
function raceList(){ return Object.entries(st.races||{}).map(([id,r])=>({id,...r})).filter(r=>isDate(r.date)).sort((a,b)=>a.date<b.date?-1:1); }
const daysTo=d=>Math.round((P(d)-P(todayStr()))/DAY);

function vGrafics(){

}
function vCalMes(){
  const today=todayStr(), ym=st.calMonth||today.slice(0,7), [Y,M]=ym.split("-").map(Number);
  const first=`${ym}-01`, start=monday(first), last=S(Date.UTC(Y,M,0));
  const races={}; raceList().forEach(r=>(races[r.date] ||= []).push(r));
  const done={}; sessList().forEach(x=>{ (done[x.date] ||= []).push(x); });
  let h=`<div class="row between" style="margin-top:14px"><button class="btn ghost" style="padding:8px 12px" data-act="calM" data-d="-1" aria-label="Mes anterior">‹</button><h2 style="margin:0;text-transform:capitalize">${MON_N[M-1]} ${Y}</h2><button class="btn ghost" style="padding:8px 12px" data-act="calM" data-d="1" aria-label="Mes següent">›</button></div>`;
  h+=`<div style="display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;margin-top:10px">${["Dl","Dt","Dc","Dj","Dv","Ds","Dg"].map(x=>`<div class="small mut" style="text-align:center">${x}</div>`).join("")}`;
  let tot={min:0,km:{},m:0};
  for(let x=start; x<=last || dow(x)!==0; x=addD(x,1)){
    const inM=x.slice(0,7)===ym, ds=done[x]||[], pl=dayItems(x), rc=races[x]||[], isT=x===today;
    if(inM) ds.forEach(q=>{ tot.min+=q.min||0; if(q.disc==="Natació") tot.m+=num(q.m)||0; else if(q.disc!=="Força"&&num(q.km)) tot.km[q.disc]=(tot.km[q.disc]||0)+num(q.km); });
    const doneD=new Set(ds.map(q=>q.disc));
    const dots=[...ds.map(q=>`<i style="width:7px;height:7px;border-radius:50%;background:${DHEX[q.disc]}"></i>`), ...pl.filter(it=>!doneD.has(it.disc)).map(it=>`<i style="width:7px;height:7px;border-radius:50%;border:1.5px solid ${DHEX[it.disc]};box-sizing:border-box"></i>`)].slice(0,6).join("");
    h+=`<button data-act="calDay" data-date="${x}" style="min-height:58px;padding:5px 3px;border-radius:10px;background:${rc.length?"color-mix(in srgb, var(--red) 18%, var(--card))":"var(--card)"};opacity:${inM?1:.35};display:flex;flex-direction:column;align-items:center;gap:4px;${isT?"outline:2px solid var(--brand);outline-offset:-2px;":""}" aria-label="${fmtLong(x)}"><span class="num" style="font-size:13px;font-weight:${isT?700:500}">${Number(x.slice(8))}</span>${rc.length?`<span style="font-size:13px;line-height:1">🏁</span>`:""}<span style="display:flex;flex-wrap:wrap;gap:2px;justify-content:center">${dots}</span></button>`;
    if(x>last && dow(x)===6) break;
  }
  h+=`</div><div class="legend" style="margin-top:10px"><span><i class="dot" style="background:var(--fg)"></i>fet</span><span><i class="dot" style="background:transparent;border:1.5px solid var(--fg)"></i>planificat</span><span>🏁 competició</span>${DISC.map(d=>`<span><i class="dot" style="background:${DHEX[d]}"></i>${d}</span>`).join("")}</div>`;
  h+=`<h2>Total del mes</h2><div class="grid3"><div class="tile"><div class="lab">Hores</div><div class="val">${r1(tot.min/60)}</div><div class="sub">h</div></div><div class="tile"><div class="lab">Natació</div><div class="val">${fmtN(tot.m)}</div><div class="sub">m</div></div><div class="tile"><div class="lab">Bici · Cursa</div><div class="val" style="font-size:22px">${fmtN(tot.km.Ciclisme||0)} · ${fmtN(tot.km.Carrera||0)}</div><div class="sub">km</div></div></div>`;
  const nx=raceList().filter(r=>r.date>=today)[0];
  if(nx) h+=`<button class="card" data-act="grTab" data-t="comp" style="width:100%;text-align:left;margin-top:10px;display:flex;justify-content:space-between;align-items:center"><span><span class="eyebrow">Propera competició</span><b style="display:block;margin-top:2px">${esc(nx.name)}</b></span><span class="num" style="font-family:var(--disp);font-size:28px;font-weight:700">${daysTo(nx.date)}<span class="mut" style="font-size:14px"> dies</span></span></button>`;
  return h;
}

const HR_Z=[["Z1","Recuperació",0,.68],["Z2","Aeròbic / resistència",.69,.83],["Z3","Tempo",.84,.94],["Z4","Llindar",.95,1.05],["Z5","VO2 màx",1.06,null]];

function vZonesFC(){

function sheetZones(){
  const p=prof();
  let h=sheetHead("Llindars","Per calcular les zones");
  h+=`<div class="f2"><div class="field"><label for="z-lthr">FC al llindar (LTHR)</label><input class="in-t" id="z-lthr" type="number" inputmode="numeric" min="100" max="230" value="${p.lthr??""}" placeholder="187"></div><div class="field"><label for="z-max">FC màxima</label><input class="in-t" id="z-max" type="number" inputmode="numeric" min="120" max="240" value="${p.hrMax??""}" placeholder="200"></div></div>
  <div class="f2"><div class="field"><label for="z-ftp">FTP (W)</label><input class="in-t" id="z-ftp" type="number" inputmode="numeric" min="50" max="600" value="${p.ftp??""}" placeholder="250"></div><div class="field"><label for="z-ftpd">Data del test FTP</label><input class="in-t" id="z-ftpd" type="date" value="${esc(p.ftpDate||"")}"></div></div>
  <div class="err" id="z-err"></div><button class="btn pri block" data-act="saveZones">Guardar</button>`;
  openSheet(h);
}
function saveZones(){
  const q=i=>num(document.querySelector(i).value), L=q("#z-lthr"), M=q("#z-max"), F=q("#z-ftp"), D=document.querySelector("#z-ftpd").value, err=document.querySelector("#z-err");
  if(L!=null&&(L<100||L>230)){ err.textContent="La LTHR ha d'estar entre 100 i 230."; return; }
  if(M!=null&&(M<120||M>240)){ err.textContent="La FC màxima ha d'estar entre 120 i 240."; return; }
  if(L!=null&&M!=null&&M<L){ err.textContent="La FC màxima ha de ser més alta que la LTHR."; return; }
  if(F!=null&&(F<50||F>600)){ err.textContent="L'FTP ha d'estar entre 50 i 600 W."; return; }
  closeSheet(); write("profile",null,{lthr:L,hrMax:M,ftp:F,ftpDate:isDate(D)?D:null}); toast("Llindars guardats");
}
function vPla(){
  const t=st.plaTab;
  if (!t || t==="home") return vProfile();
  const TT={setmanes:["Temporada","Setmanes"],macros:["Temporada","Macrocicles"],tests:["Rendiment","Tests"],pes:["Rendiment","Pes"],zfc:["Rendiment","Zones de FC"],zftp:["Rendiment","FTP i zones"],coef:["Configuració","Coeficients"]}[t]||["Jo",""];
  let h=`<div class="top"><div><button class="btn ghost" style="padding:6px 10px;font-size:13px;margin-bottom:8px" data-act="plaTab" data-t="home">‹ Jo</button><div class="eyebrow">${TT[0]}</div><h1>${TT[1]}</h1></div></div>`;
  if (t==="setmanes"){
    const s0=monday(startDate()); const cur=monday(todayStr());
    h+=`<p class="note" style="margin:12px 0">Objectius de cada setmana: hores, km i entrenaments clau. Toca una setmana per editar-la.</p><div class="stack">`;
    for (let i=0;i<52;i++){
      const ws=addD(s0,i*7), m=macroFor(ws), pl=planned(ws), wr=weekReal(ws);
      const pp=pl?.p||{}, hh=pp.h||{};
      const chips=[["Natació",pp.m?fmtN(pp.m)+" m":hh.nat?r1(hh.nat)+" h":null],["Ciclisme",hh.bici?r1(hh.bici)+" h":null],["Carrera",pp.km?pp.km+" km":hh.cursa?r1(hh.cursa)+" h":null],["Força",hh.forca?r1(hh.forca)+" h":null]].filter(x=>x[1]);
      h+=`<button class="wkrow ${ws===cur?"today-ring":""}" data-act="editPlan" data-ws="${ws}" style="align-items:start;padding-top:12px;padding-bottom:12px"><span class="stripe" style="background:${m?m.color:"var(--card2)"}"></span><span class="wkn">${i+1}</span><span style="min-width:0"><span class="row between" style="gap:8px"><span style="font-weight:600">${fmtShort(ws)} – ${fmtShort(addD(ws,6))}</span>${pp.micro?`<span class="pill">${esc(pp.micro)}</span>`:""}</span>${pp.goal?`<span class="small" style="display:block;margin-top:4px">${esc(pp.goal)}</span>`:`<span class="small mut" style="display:block;margin-top:4px">Sense planificar</span>`}${chips.length?`<span style="display:flex;flex-wrap:wrap;gap:6px;margin-top:8px">${chips.map(([d,v])=>`<span class="chip" style="padding:4px 8px;font-size:12px"><span class="dot" style="background:${DHEX[d]}"></span>${v}</span>`).join("")}</span>`:""}</span><span style="text-align:right"><span class="num" style="font-family:var(--disp);font-weight:700;font-size:18px">${pl?.hours?r1(pl.hours)+" h":"–"}</span><span class="small mut" style="display:block">${wr.min?`fet ${r1(wr.min/60)} h`:""}</span></span></button>`;
    }
    h+=`</div>`;
  } else if (t==="macros"){
    const list=macroList();
    h+=`<div class="row between" style="margin:14px 0 10px"><span class="note" style="margin:0">Un macrocicle per competició objectiu. Les dates no s'han de solapar.</span><button class="btn pri" style="padding:9px 14px;font-size:14px" data-act="editMacro">+ Nou</button></div><div class="stack">`;
    h+= list.length ? list.map(m=>{ const wks=Math.max(0,Math.round((diffD(m.end,m.start)+1)/7)); return `<button class="wkrow" data-act="editMacro" data-id="${esc(m.id)}"><span class="stripe" style="background:${m.color}"></span><span class="wkn" style="font-size:16px;color:${m.color}">${wks}<span class="small mut" style="display:block;font-size:10px">SETM.</span></span><span style="min-width:0"><span style="display:block;font-weight:600">${esc(m.name)}</span><span class="small mut">${fmtShort(m.start)} – ${fmtShort(m.end)}</span></span><span class="small" style="text-align:right">${m.race?`${esc(m.race)}<span class="mut" style="display:block">${isDate(m.raceDate)?fmtShort(m.raceDate):""}</span>`:""}</span></button>`; }).join("") : `<div class="empty">Encara no hi ha macrocicles. Crea'n un per a cada competició objectiu.</div>`;
    h+=`</div>`;
  } else if (t==="tests"){
    h+=vTests();
  } else if (t==="pes"){
    h+=vPes();
  } else if (t==="zfc"){
    h+=vZonesFC();
  } else if (t==="zftp"){
    h+=vZonesFTP();
  } else {
    const c=coefs(), tr=trans();
    h+=`<div class="card" style="margin-top:12px"><table class="tbl"><thead><tr><th>Disciplina</th><th>Coeficient</th><th>+ Brick</th></tr></thead><tbody>${DISC.map(d=>`<tr><td><span class="dot" style="background:${DHEX[d]};margin-right:8px"></span>${d}</td><td>${c[d].toFixed(2)}</td><td>${tr[d]?"+"+tr[d].toFixed(2):"–"}</td></tr>`).join("")}</tbody></table>
    <p class="note">Càrrega = minuts × RPE × coeficient (+ ajust si és brick). Per defecte, valors del mètode ECOs (Cejuela i Esteve-Lanao): carrera 1,0 · natació 0,75 · bici 0,5. Si poses 1,00 a totes, és la sRPE clàssica.</p>
    <button class="btn block" style="margin-top:10px" data-act="editCoef">Editar coeficients</button></div>`;
  }
  return h;
}

function vPes(){
  const p=prof(), ws=Object.entries(st.weights).map(([d,w])=>({d,...w})).filter(w=>isDate(w.d)&&w.kg!=null).sort((a,b)=>a.d<b.d?-1:1);
  const first=ws[0], last=ws[ws.length-1], h_=num(p.height), tgt=num(p.target);
  let h=`<div class="grid2" style="margin-top:12px">
    <div class="tile"><div class="lab">Últim pes</div><div class="val">${last?r1(last.kg):"–"}</div><div class="sub">${last?fmtShort(last.d):"kg"}</div></div>
    <div class="tile"><div class="lab">Canvi total</div><div class="val">${first&&last?(last.kg-first.kg>0?"+":"")+r1(last.kg-first.kg):"–"}</div><div class="sub">des de ${first?fmtShort(first.d):"–"}</div></div>
    <div class="tile"><div class="lab">Objectiu</div><div class="val">${tgt??"–"}</div><div class="sub">${last&&tgt!=null?`falten ${r1(Math.abs(last.kg-tgt))} kg`:"configura'l a Ajustos"}</div></div>
    <div class="tile"><div class="lab">IMC</div><div class="val">${last&&h_?r1(last.kg/(h_*h_)):"–"}</div><div class="sub">${h_?`alçada ${h_} m`:"falta l'alçada"}</div></div></div>
    <button class="btn pri block" style="margin-top:10px" data-act="newWeight">+ Afegir pes</button>
    <h2>Evolució</h2><div class="card"><div class="chartbox"><canvas id="cw" aria-label="Evolució del pes"></canvas></div></div>`;
  // weekly diff
  const byW={}; for(const w of ws){ const k=monday(w.d); (byW[k] ||= []).push(w.kg); }
  const keys=Object.keys(byW).sort(); const toward = (tgt!=null&&first) ? Math.sign(tgt-first.kg) : 0;
  h+=`<h2>Diferència entre setmanes</h2><div class="card">${keys.length?`<table class="tbl"><thead><tr><th>Setmana</th><th>Mitjana</th><th>Diferència</th></tr></thead><tbody>${keys.slice().reverse().map((k,i,arr)=>{ const avg=byW[k].reduce((a,b)=>a+b,0)/byW[k].length; const pk=arr[i+1]; const pa=pk?byW[pk].reduce((a,b)=>a+b,0)/byW[pk].length:null; const df=pa!=null?avg-pa:null; const col = df==null||!toward ? "var(--fg)" : Math.sign(df)===toward ? "var(--green)" : "var(--red)"; return `<tr><td>S${weekNo(k)} · ${fmtShort(k)}</td><td>${r1(avg).toFixed(1)}</td><td style="color:${col}">${df==null?"–":(df>0?"+":"")+r1(df).toFixed(1)}</td></tr>`; }).join("")}</tbody></table><p class="note">Verd = t'apropes a l'objectiu · Vermell = te n'allunyes.</p>`:`<div class="mut small">Quan tinguis registres de dues setmanes, aquí veuràs la diferència.</div>`}</div>`;
  h+=`<h2>Registres</h2><div class="stack">${ws.length?ws.slice().reverse().slice(0,40).map(w=>`<button class="sess" data-act="editWeight" data-d="${w.d}"><span class="t"><span class="t1">${esc(fmtLong(w.d))}</span><span class="t2">${esc(w.note||"")}</span></span><span class="ld">${r1(w.kg).toFixed(1)}<small>KG</small></span></button>`).join(""):`<div class="empty">Pesa't en dejú, sempre a la mateixa hora. 2-3 cops per setmana és suficient.</div>`}</div>`;
  return h;
}

/* ---------------- render ---------------- */
let charts=[];
function render(){
  const app=document.getElementById("app");
  charts.forEach(c=>{ try{c.destroy();}catch(e){} }); charts=[];
  let banner="";
  if (st.mode==="login"){ app.innerHTML=vLogin(); document.getElementById("tabs").innerHTML=""; return; }
  if (st.mode==="error"){ app.innerHTML=`<div class="empty" style="margin-top:40px">No s'ha pogut carregar l'app. Revisa la connexió i torna-ho a provar.</div>`; return; }
  else if (st.stale) banner=`<div class="banner">Encara no s'han pogut carregar totes les dades. El que veus pot no estar al dia.</div>`;
  if (st.mode==="loading"){ renderTabs(); return; }
  if (st.viewUid) banner+=`<div class="banner" style="display:flex;align-items:center;justify-content:space-between;gap:10px"><span>Atleta: <b>${esc(st.viewName)}</b></span><button class="btn" style="padding:6px 12px" data-act="viewSelf">Tornar a mi</button></div>`;
  const v = st.view;
  app.innerHTML = banner + (v==="avui"?vAvui():v==="setmana"?vSetmana():v==="grafics"?vGrafics():vPla());
  renderTabs();
  if (v==="grafics" && (st.grTab||"cal")==="anal") drawCharts();
  if (v==="pla" && st.plaTab==="pes") drawWeight("cw");
  if (v==="pla" && st.plaTab==="tests") drawTests();
}
function renderTabs(){
  const t=st.view, tabs=[["avui","Avui"],["setmana","Setmana"],["plus",""],["grafics","Calendari"],["pla","Jo"]];
  document.getElementById("tabs").innerHTML = tabs.map(([k,l])=> k==="plus" ? `<button class="tab plus" data-act="newSess" aria-label="Afegir sessió"><span>${TAB_ICONS.plus}</span></button>` : `<button class="tab ${t===k?"on":""}" data-act="go" data-v="${k}" ${t===k?'aria-current="page"':""}>${k==="pla"?`<img src="${avatar()}" alt="" style="width:24px;height:24px;border-radius:50%;object-fit:cover;object-position:${prof().photo?"50% 50%":"50% 18%"};background:var(--card2);${t===k?"box-shadow:0 0 0 2px var(--brand)":"opacity:.75"}">`:TAB_ICONS[k]}<span>${l}</span></button>`).join("");
}

/* ---------------- charts ---------------- */
function chartBase(){
  if (!window.Chart) return false;
  Chart.defaults.color="#8B939C"; Chart.defaults.font.family='Barlow, system-ui, sans-serif'; Chart.defaults.borderColor="#1E2227";
  return true;
}
const gridOpt = {grid:{color:"#1E2227"},ticks:{color:"#8B939C"}};
function drawCharts(){
  if (!chartBase()){ document.querySelectorAll(".chartbox").forEach(b=>b.innerHTML='<div class="mut small">No s\'han pogut carregar els gràfics.</div>'); return; }
  const n=st.chartRange, cur=monday(todayStr()), weeks=[...Array(n)].map((_,i)=>addD(cur,(i-n+1)*7));

  charts.push(new Chart(document.getElementById("c2"),{type:"line",data:{labels:days.map(fmtShort),datasets:[{label:"Aguda (7 d)",data:acs.map(a=>Math.round(a.a)),borderColor:"#FFD400",backgroundColor:"rgba(255,212,0,.12)",fill:true,pointRadius:0,tension:.3},{label:"Crònica (21 d ÷ 3)",data:acs.map(a=>Math.round(a.c)),borderColor:"#F2F4F5",pointRadius:0,tension:.3}]},options:{maintainAspectRatio:false,interaction:{mode:"index",intersect:false},plugins:{legend:{position:"bottom",labels:{boxWidth:10,boxHeight:10}}},scales:{x:{...gridOpt,grid:{display:false},ticks:{color:"#8B939C",maxTicksLimit:7,maxRotation:0}},y:{...gridOpt,beginAtZero:true}}}}));
  const acw=weeks.map(w=>acuteChronic(addD(w,6)<todayStr()?addD(w,6):todayStr(),tot).acwr);
  charts.push(new Chart(document.getElementById("c3"),{type:"bar",data:{labels,datasets:[{label:"ACWR",data:acw.map(x=>x==null?null:Math.round(x*100)/100),backgroundColor:acw.map(x=>{const z=acwrZone(x);return z?({"var(--red)":"#FF3B4E","var(--yellow)":"#FF9F1C","var(--green)":"#18D67A","var(--blue)":"#5B9BFF"})[z[1]]:"#24282E";}),borderRadius:4}]},options:{maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{...gridOpt,grid:{display:false}},y:{...gridOpt,beginAtZero:true,suggestedMax:1.6}}}}));
  const d28=[...Array(28)].map((_,i)=>addD(todayStr(),i-27)); const recs=d28.map(recovery);
  charts.push(new Chart(document.getElementById("c4"),{data:{labels:d28.map(fmtShort),datasets:[{type:"bar",label:"Recuperació %",data:recs.map(r=>r?.pct??null),backgroundColor:recs.map(r=>r?({"var(--red)":"#FF3B4E","var(--yellow)":"#FF9F1C","var(--green)":"#18D67A"})[r.color]||"#24282E":"#24282E"),borderRadius:3,yAxisID:"y"},{type:"line",label:"Son",data:d28.map(d=>st.daily[d]?.sleepScore??st.daily[d]?.garmin?.sleepScore??null),borderColor:"#A18BFF",pointRadius:2,spanGaps:true,yAxisID:"y",tension:.3},{type:"line",label:"FC repòs (ppm)",data:d28.map(d=>rhrOf(d)),borderColor:"#18D67A",borderDash:[4,3],pointRadius:2,spanGaps:true,yAxisID:"y",tension:.3},{type:"line",label:"VFC (ms)",data:d28.map(d=>st.daily[d]?.hrv??null),borderColor:"#F2F4F5",pointRadius:2,spanGaps:true,yAxisID:"y1",tension:.3}]},options:{maintainAspectRatio:false,plugins:{legend:{position:"bottom",labels:{boxWidth:10,boxHeight:10}}},scales:{x:{...gridOpt,grid:{display:false},ticks:{color:"#8B939C",maxTicksLimit:7,maxRotation:0}},y:{...gridOpt,min:0,max:100,title:{display:true,text:"%",color:"#8B939C"}},y1:{position:"right",grid:{display:false},ticks:{color:"#8B939C"},title:{display:true,text:"ms",color:"#8B939C"}}}}}));
  drawWeight("c5");

function drawTests(){
  if(!st._tg||!st._tg.length) return; if(!chartBase()) return;
  for(const g of st._tg){ const el=document.getElementById(g.id); if(!el) continue; const T=g.T, isT=T.kind==="time"||T.kind==="pace", col=DHEX[T.disc]||"#FFD400";
    const fmt=v=>isT?fmtTime(v)+(T.kind==="pace"?"/km":""):T.kind==="watts"?Math.round(v)+" W":Math.round(v)+" ppm";
    charts.push(new Chart(el,{type:"line",data:{labels:g.arr.map(t=>fmtShort(t.date)),datasets:[{label:T.label,data:g.arr.map(t=>t.value),borderColor:col,backgroundColor:col,pointRadius:4,pointHoverRadius:6,tension:.25}]},
      options:{maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>fmt(c.parsed.y)}}},
      scales:{x:{...gridOpt,grid:{display:false},ticks:{color:"#8B939C",maxRotation:0,maxTicksLimit:6}},y:{...gridOpt,reverse:isT||T.better===-1&&T.kind==="bpm",grace:"10%",ticks:{color:"#8B939C",maxTicksLimit:4,callback:v=>fmt(v)}}}}}));
  }
}
function drawWeight(id){
  const el=document.getElementById(id); if(!el) return;
  if (!chartBase()){ el.parentElement.innerHTML='<div class="mut small">No s\'han pogut carregar els gràfics.</div>'; return; }
  const ws=Object.entries(st.weights).filter(([d,w])=>isDate(d)&&w.kg!=null).sort((a,b)=>a[0]<b[0]?-1:1);
  const avg=ws.map(([d])=>{ const win=ws.filter(([x])=>x<=d&&x>addD(d,-7)).map(([,w])=>w.kg); return r1(win.reduce((a,b)=>a+b,0)/win.length); });
  const tgt=num(prof().target);
  const ds=[{label:"Pes",data:ws.map(([,w])=>w.kg),borderColor:"#FFD400",backgroundColor:"#FFD400",pointRadius:3,tension:.2},{label:"Mitjana 7 dies",data:avg,borderColor:"#F2F4F5",pointRadius:0,tension:.3}];
  if (tgt!=null) ds.push({label:"Objectiu",data:ws.map(()=>tgt),borderColor:"#18D67A",borderDash:[5,4],pointRadius:0});
  charts.push(new Chart(el,{type:"line",data:{labels:ws.map(([d])=>fmtShort(d)),datasets:ds},options:{maintainAspectRatio:false,plugins:{legend:{position:"bottom",labels:{boxWidth:10,boxHeight:10}}},scales:{x:{...gridOpt,grid:{display:false},ticks:{color:"#8B939C",maxTicksLimit:7,maxRotation:0}},y:{...gridOpt}}}}));
}

/* ---------------- sheets ---------------- */
let sheetState=null;
function openSheet(html, onMount){ const host=document.getElementById("sheetHost"); host.innerHTML=`<div class="scrim" data-act="closeScrim"><div class="sheet" role="dialog" aria-modal="true">${html}</div></div>`; document.body.style.overflow="hidden"; onMount && onMount(host.querySelector(".sheet")); const f=host.querySelector("input,select,button"); }
function closeSheet(){ detCharts.forEach(c=>{ try{c.destroy();}catch(e){} }); detCharts=[]; document.getElementById("sheetHost").innerHTML=""; document.body.style.overflow=""; sheetState=null; }
const sheetHead = (t,sub) => `<div class="row between"><div><h3>${esc(t)}</h3>${sub?`<div class="mut small" style="margin-top:2px">${esc(sub)}</div>`:""}</div><button class="btn ghost" style="padding:8px 12px" data-act="close" aria-label="Tancar">✕</button></div>`;
const pickRow = (name,max,val,min=1) => `<div class="pick" style="grid-template-columns:repeat(${max-min+1},minmax(0,1fr))" data-pick="${name}">${[...Array(max-min+1)].map((_,i)=>{const v=i+min;return `<button type="button" class="${val===v?"on":""}" data-v="${v}">${v}</button>`;}).join("")}</div>`;
function wirePicks(root, onChange){
  root.querySelectorAll("[data-pick]").forEach(g=>g.addEventListener("click",e=>{ const b=e.target.closest("button[data-v]"); if(!b) return; g.querySelectorAll("button").forEach(x=>x.classList.toggle("on",x===b)); sheetState[g.dataset.pick]=Number(b.dataset.v); onChange&&onChange(); }));
}
function delButton(){ return `<button class="btn danger block" style="margin-top:10px" data-act="askDel">Esborrar</button>`; }
function confirmDel(btn, fn){ if(btn.dataset.armed){ fn(); return; } btn.dataset.armed="1"; btn.textContent="Toca de nou per confirmar"; setTimeout(()=>{ if(btn.isConnected){ delete btn.dataset.armed; btn.textContent="Esborrar"; } },4000); }

function sheetMorning(date){
  const ex=st.daily[date]||{};
  sheetState={kind:"morning",date, hrv:ex.hrv??null, sleep:ex.sleep??null, fatigue:ex.fatigue??null, soreness:ex.soreness??null, stress:ex.stress??null};
  let h=sheetHead("Control del matí", fmtLong(date));
  const gm=ex.garmin||{};
  h+=`<div class="field"><label for="m-date">Data</label><input class="in-t" id="m-date" type="date" value="${date}"></div>
  <div class="f2"><div class="field"><label for="m-sleep">1 · Puntuació de son</label><input class="in-t" id="m-sleep" type="number" inputmode="numeric" min="0" max="100" step="1" value="${ex.sleepScore??gm.sleepScore??""}" placeholder="0-100"></div>
  <div class="field"><label for="m-rhr">2 · FC en repòs (ppm)</label><input class="in-t" id="m-rhr" type="number" inputmode="numeric" min="25" max="120" step="1" value="${ex.rhr??gm.rhr??""}" placeholder="48"></div></div>
  <div class="note">Valors en llevar-te, de Garmin o Bevel. La VFC s'importa sola de Garmin${(ex.hrv??gm.hrvG)!=null?` (avui ${ex.hrv??gm.hrvG} ms)`:""}.</div>
  <div class="field"><label for="m-kg">3 · Pes (kg)</label><input class="in-t" id="m-kg" type="number" inputmode="decimal" step="0.1" min="30" max="250" value="${st.weights[date]?.kg??""}" placeholder="En dejú, després d'anar al lavabo"></div>`;
  for (const [k,l,lo,hi] of Q_ITEMS) h+=`<div class="field"><span class="flab">${l}</span>${pickRow(k,5,sheetState[k])}<div class="row between note" style="margin-top:2px"><span>1 · ${lo}</span><span>5 · ${hi}</span></div></div>`;
  h+=`<div class="preview"><span class="mut">Recuperació</span><span class="big" id="m-prev">–</span></div><div class="err" id="m-err"></div>
  <button class="btn pri block" data-act="saveMorning">Guardar</button>${st.daily[date]?delButton():""}`;
  openSheet(h, root=>{ const upd=()=>{ const t=Q_ITEMS.map(([k])=>sheetState[k]); root.querySelector("#m-prev").textContent = t.every(v=>v!=null) ? t.reduce((a,b)=>a+b,0)+"/20" : "–"; root.querySelector("#m-err").textContent=""; }; wirePicks(root,upd); upd(); root.querySelector("#m-date").addEventListener("change",e=>{ if(isDate(e.target.value)){ closeSheet(); sheetMorning(e.target.value); } }); });
}
function saveMorning(){
  const root=document.querySelector(".sheet"), hrv=null, err=root.querySelector("#m-err");
  const sleepScore=num(root.querySelector("#m-sleep").value), rhr=num(root.querySelector("#m-rhr").value), kg=num(root.querySelector("#m-kg").value);
  if (kg!=null&&(kg<30||kg>250)){ err.textContent="Posa un pes entre 30 i 250 kg."; return; }
  const miss=Q_ITEMS.filter(([k])=>sheetState[k]==null).map(([,l])=>l);
  if (sleepScore!=null&&(sleepScore<0||sleepScore>100)){ err.textContent="La puntuació de son ha d'estar entre 0 i 100."; return; }
  if (rhr!=null&&(rhr<25||rhr>120)){ err.textContent="La FC en repòs ha d'estar entre 25 i 120 ppm."; return; }
  if (hrv==null && sleepScore==null && rhr==null && kg==null && miss.length===4){ err.textContent="Omple almenys una dada."; return; }
  if (miss.length && miss.length<4){ err.textContent="Respon les 4 preguntes: falta "+miss.join(", ")+"."; return; }
  if (hrv!=null && (hrv<1||hrv>300)){ err.textContent="La VFC ha d'estar entre 1 i 300 ms."; return; }
  const d=sheetState.date, prevD=st.daily[d]||{};
  const data={...prevD, hrv: prevD.hrv ?? prevD.garmin?.hrvG ?? null, sleepScore, rhr}; delete data.bb; if(data.hrv!=null && !data.hrvSrc) data.hrvSrc="garmin"; for(const [k] of Q_ITEMS) data[k]=sheetState[k];
  if (kg!=null && kg!==st.weights[d]?.kg) write("weights",d,{kg,note:st.weights[d]?.note||""}); closeSheet(); write("daily",d,data); toast("Control del matí guardat");
}

function sheetSession(id, date){
  const ex = id ? {...st.sessions[id]} : {date:date||todayStr(), disc:"Ciclisme", min:null, rpe:null, brick:false};
  sheetState={kind:"sess", id, ...ex};
  const body = () => {
    const s=sheetState, d=s.disc;
    let h=sheetHead(id?(s.pending?"Revisar activitat":"Editar sessió"):"Nova sessió");
    if (s.source==="garmin") h+=`<div class="banner" style="margin:12px 0 0">Importada de Garmin${s.start?` · ${new Date(s.start).toLocaleTimeString("ca-ES",{hour:"2-digit",minute:"2-digit"})}`:""}. ${s.pending?"Comprova les dades i posa la RPE.":""}</div>`;
    if (s.source==="garmin" && id) h+=`<button class="btn block" style="margin-top:10px" data-act="actDetail" data-id="${esc(id)}">📍 Veure detall (mapa, FC, zones, voltes)</button>`;
    h+=`<div class="field"><span class="flab">Disciplina</span><div class="disc-pick">${DISC.map(x=>`<button type="button" data-disc="${x}" class="${d===x?"on":""}" style="${d===x?`border-color:${DHEX[x]};background:color-mix(in srgb, ${DHEX[x]} 16%, var(--card))`:""}"><span style="color:${DHEX[x]}">${ICON[x]}</span>${x}</button>`).join("")}</div></div>
    <div class="f2"><div class="field"><label for="s-date">Data</label><input class="in-t" id="s-date" type="date" value="${esc(s.date)}"></div><div class="field"><label for="s-min">Minuts</label><input class="in-t" id="s-min" type="number" inputmode="numeric" min="1" max="900" value="${s.min??""}" placeholder="60"></div></div>
    <div class="field"><span class="flab">RPE (0-10) · <span id="s-rpelab" style="color:var(--fg)">${s.rpe!=null?RPE_LAB[s.rpe]:"tria-la uns 30 min després"}</span></span>${pickRow("rpe",10,s.rpe,0)}</div>`;
    if (d==="Natació") h+=`<div class="field"><label for="s-m">Metres</label><input class="in-t" id="s-m" type="number" inputmode="numeric" value="${s.m??""}" placeholder="2500"></div>`;
    if (d==="Ciclisme") h+=`<div class="f3"><div class="field"><label for="s-km">Km</label><input class="in-t" id="s-km" type="number" inputmode="decimal" step="0.1" value="${s.km??""}"></div><div class="field"><label for="s-w">Watts mitjana</label><input class="in-t" id="s-w" type="number" inputmode="numeric" value="${s.w??""}"></div><div class="field"><label for="s-fc">FC mitjana</label><input class="in-t" id="s-fc" type="number" inputmode="numeric" value="${s.fc??""}"></div></div>`;
    if (d==="Carrera") h+=`<div class="f2"><div class="field"><label for="s-km">Km</label><input class="in-t" id="s-km" type="number" inputmode="decimal" step="0.1" value="${s.km??""}"></div><div class="field"><label for="s-fc">FC mitjana</label><input class="in-t" id="s-fc" type="number" inputmode="numeric" value="${s.fc??""}"></div></div>`;
    if (d==="Força") h+=`<div class="f3"><div class="field"><label for="s-sets">Sèries</label><input class="in-t" id="s-sets" type="number" inputmode="numeric" value="${s.sets??""}"></div><div class="field"><label for="s-reps">Reps</label><input class="in-t" id="s-reps" type="number" inputmode="numeric" value="${s.reps??""}"></div><div class="field"><label for="s-kg">Kg</label><input class="in-t" id="s-kg" type="number" inputmode="decimal" value="${s.kg??""}"></div></div>`;
    if (d==="Ciclisme"||d==="Carrera") h+=`<button type="button" class="toggle" style="width:100%" data-act="brick"><span style="text-align:left"><b>Brick / transició</b><span class="note" style="display:block;margin:0">${d==="Carrera"?"Carrera just després de la bici (+"+trans()["Carrera"].toFixed(2)+")":"Bici just després de nedar (+"+trans()["Ciclisme"].toFixed(2)+")"}</span></span><span class="sw ${s.brick?"on":""}"><i></i></span></button>`;
    h+=`<div class="field"><label for="s-desc">Descripció</label><input class="in-t" id="s-desc" type="text" maxlength="80" value="${esc(s.desc||"")}" placeholder="${d==="Carrera"?"Rodatge Z2":d==="Ciclisme"?"4x8' a llindar":d==="Natació"?"Tècnica + 8x100":"Esquat + core"}"></div>
    <div class="preview"><span><span class="mut">Càrrega ponderada</span><span class="note" style="display:block;margin:0" id="s-form">–</span></span><span class="big" id="s-prev">–</span></div><div class="err" id="s-err"></div>
    <button class="btn pri block" data-act="saveSess">Guardar</button>${id?delButton():""}`;
    return h;
  };
  const mount = root => {
    const upd=()=>{ readSess(root); const s=sheetState; const c=coefOf(s); const ok=s.min&&s.rpe!=null; root.querySelector("#s-prev").textContent= ok?fmtN(s.min*s.rpe*c):"–"; root.querySelector("#s-form").textContent= ok?`${s.min} × ${s.rpe} × ${c.toFixed(2)}`:`coeficient ${c.toFixed(2)}`; root.querySelector("#s-err").textContent=""; const lab=root.querySelector("#s-rpelab"); if(s.rpe!=null) lab.textContent=RPE_LAB[s.rpe]; };
    wirePicks(root,upd);
    root.querySelectorAll("input").forEach(i=>i.addEventListener("input",upd));
    root.querySelectorAll("[data-disc]").forEach(b=>b.addEventListener("click",()=>{ readSess(root); sheetState.disc=b.dataset.disc; if(sheetState.disc==="Natació"||sheetState.disc==="Força") sheetState.brick=false; root.innerHTML=body(); mount(root); }));
    upd();
  };
  openSheet(body(), mount);
  sheetSession.rebuild = () => { const root=document.querySelector(".sheet"); readSess(root); root.innerHTML=body(); mount(root); };
}
function readSess(root){
  const s=sheetState, g=id=>root.querySelector("#"+id);
  if(g("s-date")) s.date=g("s-date").value; if(g("s-min")) s.min=num(g("s-min").value);
  for (const [k,id] of [["m","s-m"],["km","s-km"],["w","s-w"],["fc","s-fc"],["sets","s-sets"],["reps","s-reps"],["kg","s-kg"]]) if(g(id)) s[k]=num(g(id).value);
  if(g("s-desc")) s.desc=g("s-desc").value.trim();
}
function saveSess(){
  const root=document.querySelector(".sheet"); readSess(root); const s=sheetState, err=root.querySelector("#s-err");
  if(!isDate(s.date)){ err.textContent="Tria una data."; return; }
  if(!s.min||s.min<=0){ err.textContent="Posa els minuts de la sessió."; return; }
  if(s.rpe==null){ err.textContent="Tria la RPE (0-10)."; return; }
  const data={date:s.date,disc:s.disc,min:s.min,rpe:s.rpe,brick:!!s.brick,desc:s.desc||"",pending:false};
  if(s.source){ data.source=s.source; data.gid=s.gid||null; data.start=s.start||null; }
  if(s.disc==="Natació") data.m=s.m??null;
  if(s.disc==="Ciclisme"){ data.km=s.km??null; data.w=s.w??null; data.fc=s.fc??null; }
  if(s.disc==="Carrera"){ data.km=s.km??null; data.fc=s.fc??null; }
  if(s.disc==="Força"){ data.sets=s.sets??null; data.reps=s.reps??null; data.kg=s.kg??null; }
  const id=s.id||newId(); closeSheet(); write("sessions",id,data); toast("Sessió guardada");
}

function sheetPlan(ws){
  const ex=st.plan[ws]||{}; const m=macroFor(ws);
  sheetState={kind:"plan",ws};
  let h=sheetHead(`Pla · Setmana ${weekNo(ws)}`, `${fmtShort(ws)} – ${fmtShort(addD(ws,6))}${m?" · "+m.name:""}`);
  h+=`<div class="flab" style="margin-top:16px">Entrenaments planificats</div><div class="stack" style="margin-top:8px">`;
  for(let i=0;i<7;i++){ const x=addD(ws,i), its=dayItems(x), nt=st.dayplan[x]?.note||"";
    h+=`<button class="day" data-act="editDay" data-date="${x}" style="width:100%;text-align:left;background:var(--card)"><div class="dayh"><span class="d">${DAYS[i]} ${Number(x.slice(8))}</span><span class="small mut">${its.length?fmtMinH(its.reduce((a,t)=>a+(t.min||0),0)):(st.dayplan[x]?"Descans":"–")}</span></div>${its.map(t=>`<div class="row" style="gap:8px;margin-top:6px;align-items:flex-start"><span class="dot" style="background:${DHEX[t.disc]};margin-top:6px"></span><div style="min-width:0"><div style="font-weight:600;font-size:14px">${esc(t.title||t.disc)}${t.min?` <span class="mut" style="font-weight:400">· ${fmtMinH(t.min)}</span>`:""}</div>${t.detail?`<div class="small mut" style="white-space:pre-line">${esc(t.detail)}</div>`:""}</div></div>`).join("")}${nt?`<div class="note" style="margin-top:6px">${esc(nt)}</div>`:""}</button>`; }
  h+=`</div><div class="note">Toca un dia per editar-ne les sessions.</div><div class="flab" style="margin-top:22px">Objectius de la setmana</div>`;
  h+=`<div class="f2"><div class="field"><label for="p-meso">Mesocicle</label><select class="in-t" id="p-meso"><option value=""></option>${MESO.map(x=>`<option ${ex.meso===x?"selected":""}>${x}</option>`).join("")}</select></div><div class="field"><label for="p-micro">Microcicle</label><select class="in-t" id="p-micro"><option value=""></option>${MICRO.map(x=>`<option ${ex.micro===x?"selected":""}>${x}</option>`).join("")}</select></div></div>
  <div class="field"><label for="p-goal">Objectiu / contingut</label><input class="in-t" id="p-goal" type="text" maxlength="100" value="${esc(ex.goal||"")}" placeholder="Volum Z2 + força base"></div>
  <div class="f2"><div class="field"><label for="p-m">Natació (metres)</label><input class="in-t" id="p-m" type="number" inputmode="numeric" step="100" min="0" value="${ex.m??""}" placeholder="10000"></div><div class="field"><label for="p-km">Cursa (km)</label><input class="in-t" id="p-km" type="number" inputmode="decimal" step="1" min="0" value="${ex.km??""}" placeholder="45"></div></div>
  <div class="field"><span class="flab">Hores i RPE mitjana per disciplina</span></div>`;
  for (const d of DISC){ const k=DKEY[d]; h+=`<div class="row" style="margin-top:8px"><span style="color:${DHEX[d]};width:26px;flex:none">${ICON[d].replace("<svg",'<svg width="22" height="22"')}</span><span style="width:74px;flex:none;font-weight:600">${d}</span><input class="in-t" style="min-width:0" id="p-h-${k}" type="number" inputmode="decimal" step="0.25" min="0" placeholder="hores" aria-label="Hores ${d}" value="${ex.h?.[k]??""}"><input class="in-t" style="min-width:0" id="p-r-${k}" type="number" inputmode="decimal" step="0.5" min="0" max="10" placeholder="RPE" aria-label="RPE ${d}" value="${ex.rpe?.[k]??""}"></div>`; }
  h+=`<div class="note">Orientació RPE: Z2 i rodatges 3-4 · setmana amb sèries 5-6 · força 6-7.</div>
  <div class="preview"><span><span class="mut">Càrrega planificada</span><span class="note" style="display:block;margin:0" id="p-hours">–</span></span><span class="big" id="p-prev">–</span></div><div class="err" id="p-err"></div>
  <button class="btn pri block" data-act="savePlan">Guardar</button><button class="btn ghost block" style="margin-top:8px" data-act="copyPrev">Copiar de la setmana anterior</button>`;
  const mount=root=>{ const upd=()=>{ const c=coefs(); let L=0,H=0; for(const d of DISC){ const k=DKEY[d], hh=num(root.querySelector("#p-h-"+k).value), rr=num(root.querySelector("#p-r-"+k).value); if(hh!=null){H+=hh; if(rr!=null) L+=hh*60*rr*(c[d]??1);} } root.querySelector("#p-prev").textContent=H?fmtN(L):"–"; root.querySelector("#p-hours").textContent=H?`${r1(H)} h totals`:"–"; root.querySelector("#p-err").textContent=""; }; root.querySelectorAll("input").forEach(i=>i.addEventListener("input",upd)); upd(); };
  openSheet(h,mount);
}
function savePlan(){
  const root=document.querySelector(".sheet"), err=root.querySelector("#p-err"), ws=sheetState.ws;
  const data={meso:root.querySelector("#p-meso").value, micro:root.querySelector("#p-micro").value, goal:root.querySelector("#p-goal").value.trim(), m:num(root.querySelector("#p-m").value), km:num(root.querySelector("#p-km").value), h:{}, rpe:{}};
  for(const d of DISC){ const k=DKEY[d], hh=num(root.querySelector("#p-h-"+k).value), rr=num(root.querySelector("#p-r-"+k).value);
    if(hh!=null&&(hh<0||hh>40)){ err.textContent=`Revisa les hores de ${d}.`; return; }
    if(rr!=null&&(rr<0||rr>10)){ err.textContent=`La RPE de ${d} ha d'estar entre 0 i 10.`; return; }
    if(hh!=null&&rr==null&&hh>0){ err.textContent=`Falta la RPE de ${d}.`; return; }
    data.h[k]=hh; data.rpe[k]=rr; }
  closeSheet(); write("plan",ws,data); toast("Pla guardat");
}
function copyPrev(){
  const ws=sheetState.ws, prev=st.plan[addD(ws,-7)], root=document.querySelector(".sheet");
  if(!prev){ root.querySelector("#p-err").textContent="La setmana anterior no té pla."; return; }
  for(const d of DISC){ const k=DKEY[d]; root.querySelector("#p-h-"+k).value=prev.h?.[k]??""; root.querySelector("#p-r-"+k).value=prev.rpe?.[k]??""; }
  if(prev.meso) root.querySelector("#p-meso").value=prev.meso; if(prev.micro) root.querySelector("#p-micro").value=prev.micro;
  root.querySelector("#p-h-nat").dispatchEvent(new Event("input"));
}

  nat400:{label:"Natació 400 m", disc:"Natació", kind:"time", better:-1, dist:400},

  run10k:{label:"Carrera 10 km", disc:"Carrera", kind:"time", better:-1, dist:10000},

function parseTime(v){ v=String(v||"").trim(); if(!v) return null; const parts=v.split(":").map(x=>x.trim()); if(parts.some(x=>x===""||isNaN(Number(x)))) return null; let sec=0; for(const x of parts) sec=sec*60+Number(x); return sec>0?sec:null; }

  return ""; }
function testList(){ return Object.entries(st.tests).map(([id,t])=>({id,...t})).filter(t=>isDate(t.date)).sort((a,b)=>a.date<b.date?1:-1); }

  const root=document.querySelector(".sheet"), err=root.querySelector("#st-err"), g=i=>root.querySelector("#"+i).value;
  const start=g("st-start"); if(!isDate(start)){ err.textContent="Tria la data d'inici."; return; }
  if(dow(start)!==0){ err.textContent="La data d'inici ha de ser un dilluns."; return; }
  const height=num(g("st-h")), target=num(g("st-t")), hrvLo=num(g("st-vlo")), hrvHi=num(g("st-vhi"));
  if((hrvLo==null)!==(hrvHi==null)||(hrvLo!=null&&(hrvLo<5||hrvHi>300||hrvHi<=hrvLo))){ err.textContent="Posa el rang de VFC amb el mínim i el màxim (el màxim ha de ser més gran)."; return; }
  if(height!=null&&(height<1||height>2.5)){ err.textContent="Posa l'alçada en metres, per exemple 1.75."; return; }
  closeSheet(); write("profile",null,{name:g("st-name").trim(),start,height,target,hrvLo,hrvHi,coefs:coefs(),trans:trans()}); toast("Ajustos guardats");
}
function sheetCoef(){
  const c=coefs(), t=trans(); sheetState={kind:"coef"};
  let h=sheetHead("Coeficients","Càrrega = min × RPE × coeficient");
  for(const d of DISC){ const k=DKEY[d]; h+=`<div class="row" style="margin-top:12px"><span style="color:${DHEX[d]};width:26px">${ICON[d].replace("<svg",'<svg width="22" height="22"')}</span><span style="width:74px;font-weight:600">${d}</span><div style="flex:1;min-width:0"><label class="flab" for="c-${k}" style="display:block;font-size:11px">Coeficient</label><input class="in-t" id="c-${k}" type="number" inputmode="decimal" step="0.05" min="0" max="3" value="${c[d]}"></div>${(d==="Ciclisme"||d==="Carrera")?`<div style="flex:1;min-width:0"><label class="flab" for="t-${k}" style="display:block;font-size:11px">+ Brick</label><input class="in-t" id="t-${k}" type="number" inputmode="decimal" step="0.05" min="0" max="1" value="${t[d]}"></div>`:`<div style="flex:1"></div>`}</div>`; }
  h+=`<div class="err" id="c-err"></div><button class="btn pri block" data-act="saveCoef">Guardar</button><button class="btn ghost block" style="margin-top:8px" data-act="resetCoef">Valors ECOs per defecte</button>`;
  openSheet(h);
}
function saveCoef(reset){
  const root=document.querySelector(".sheet"), err=root.querySelector("#c-err"); const c={...DEF_COEF}, t={...DEF_TRANS};
  if(!reset) for(const d of DISC){ const k=DKEY[d], v=num(root.querySelector("#c-"+k).value); if(v==null||v<0||v>3){ err.textContent=`Revisa el coeficient de ${d} (0 a 3).`; return; } c[d]=v; const ti=root.querySelector("#t-"+k); if(ti){ const tv=num(ti.value); if(tv==null||tv<0||tv>1){ err.textContent=`Revisa l'ajust de brick de ${d}.`; return; } t[d]=tv; } }
  closeSheet(); write("profile",null,{...(st.profile||{}),coefs:c,trans:t}); toast(reset?"Coeficients restablerts":"Coeficients guardats");
}

async function exportXlsx(){
  if(!window.XLSX){ toast("No s'ha pogut preparar l'Excel."); return; }
  const dl={save:async({filename,data})=>{ const u=URL.createObjectURL(data); const a=document.createElement("a"); a.href=u; a.download=filename; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(u),2000); }};
  const wb=XLSX.utils.book_new();
  const ses=sessList().sort((a,b)=>a.date<b.date?-1:1).map(s=>({Data:s.date,Setmana:weekNo(monday(s.date)),Disciplina:s.disc,Descripció:s.desc||"",Minuts:s.min,RPE:s.rpe,Brick:s.brick?"Sí":"",Metres:s.m??"",Km:s.km??"",Watts:s.w??"",FC:s.fc??"",Sèries:s.sets??"",Reps:s.reps??"",Kg:s.kg??"",sRPE:Math.round(rawOf(s)),Coeficient:coefOf(s),"sRPE ponderada":Math.round(loadOf(s))}));
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(ses.length?ses:[{Data:""}]),"Sessions");
  const dly=Object.keys(st.daily).filter(isDate).sort().map(d=>{const r=recovery(d);return {Data:d,"Son (0-100)":st.daily[d].sleepScore??st.daily[d].garmin?.sleepScore??"","FC repòs":rhrOf(d)??"",VFC:st.daily[d].hrv??"",Son:st.daily[d].sleep??"",Fatiga:st.daily[d].fatigue??"",Dolor:st.daily[d].soreness??"",Estrès:st.daily[d].stress??"","Total (4-20)":r?.total??"","Desviació VFC":r?.dev!=null?Math.round(r.dev*1000)/10+"%":"","Recuperació %":r?.pct??"",Decisió:r?.decision??""};});
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(dly.length?dly:[{Data:""}]),"Control diari");
  const wts=Object.keys(st.weights).filter(isDate).sort().map(d=>({Data:d,"Pes (kg)":st.weights[d].kg,Notes:st.weights[d].note||""}));
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(wts.length?wts:[{Data:""}]),"Pes");
  const s0=monday(startDate()); const {tot}=dayMaps();
  const pl=[...Array(52)].map((_,i)=>{const ws=addD(s0,i*7),p=planned(ws),wr=weekReal(ws),m=macroFor(ws),ac=acuteChronic(addD(ws,6),tot);const row={Setmana:i+1,Inici:ws,Macrocicle:m?.name||"",Mesocicle:p?.p?.meso||"",Microcicle:p?.p?.micro||"",Objectiu:p?.p?.goal||""};for(const d of DISC){row[d+" h"]=p?.p?.h?.[DKEY[d]]??"";row[d+" RPE"]=p?.p?.rpe?.[DKEY[d]]??"";}Object.assign(row,{"Càrrega planificada":p?.load!=null?Math.round(p.load):"","Càrrega real":Math.round(wr.load),"sRPE clàssica":Math.round(wr.raw),"Hores reals":r1(wr.min/60),ACWR:ac.acwr!=null?Math.round(ac.acwr*100)/100:""});return row;});
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(pl),"Planificació");
  const mc=macroList().map(m=>({Macrocicle:m.name,Inici:m.start,Fi:m.end,Competició:m.race||"","Data competició":m.raceDate||""}));
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(mc.length?mc:[{Macrocicle:""}]),"Macrocicles");
  const tsx=testList().slice().reverse().map(t=>({Data:t.date,Prova:t.type==="altre"?(t.name||"Altre"):(TEST_TYPES[t.type]?.label||t.type),Resultat:t.type==="altre"?(t.text||""):testVal(t),Equivalència:testDerived(t),"FC mitjana":t.fc??"",Notes:t.note||""}));
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(tsx.length?tsx:[{Data:""}]),"Tests");
  const out=XLSX.write(wb,{bookType:"xlsx",type:"array"});
  try{ await dl.save({filename:`carrega-tri-${todayStr()}.xlsx`,data:new Blob([out])}); toast("Excel descarregat"); }
  catch(e){ if(e&&e.code!=="declined") toast("No s'ha pogut descarregar l'Excel."); }
}

/* ---------------- events ---------------- */
document.addEventListener("click", e=>{
  const el=e.target.closest("[data-act]"); if(!el) return; const a=el.dataset.act;
  if (a==="closeScrim"){ if(e.target===el) closeSheet(); return; }
  switch(a){
    case "go": if(el.dataset.v==="avui"&&st.view==="avui") st.planDay=null; st.view=el.dataset.v; if(st.view==="setmana") st.weekRef=monday(todayStr()); if(st.view==="pla") st.plaTab="home"; render(); window.scrollTo(0,0); break;
    case "close": closeSheet(); break;
    case "newSess": sheetSession(null, el.dataset.date || (st.view==="setmana" && todayStr()>=st.weekRef && todayStr()<=addD(st.weekRef,6) ? todayStr() : st.view==="setmana" ? st.weekRef : todayStr())); break;
    case "editSess": sheetSession(el.dataset.id); break;
    case "saveSess": saveSess(); break;
    case "brick": { const root=document.querySelector(".sheet"); readSess(root); sheetState.brick=!sheetState.brick; sheetSession.rebuild(); break; }
    case "morning": sheetMorning(el.dataset.date||todayStr()); break;
    case "saveMorning": saveMorning(); break;
    case "wk": st.weekRef = el.dataset.d==="0" ? monday(todayStr()) : addD(st.weekRef, Number(el.dataset.d)); render(); break;
    case "range": st.chartRange=Number(el.dataset.n); render(); break;
    case "plaTab": st.plaTab=el.dataset.t; render(); break;
    case "editPlan": sheetPlan(el.dataset.ws); break;
    case "savePlan": savePlan(); break;
    case "copyPrev": copyPrev(); break;
    case "editMacro": sheetMacro(el.dataset.id||null); break;
    case "saveMacro": saveMacro(); break;
    case "login": doLogin(); break;
    case "loginMode": st.loginMode=el.dataset.m; render(); break;
    case "logout": sb&&sb.auth.signOut(); break;
    case "viewAth": viewAthlete(el.dataset.id); break;
    case "photo": sheetPhoto("photo"); break;
    case "editZones": if(st.viewUid){ toast("Els llindars els edita l'atleta des del seu compte."); break; } sheetZones(); break;
    case "saveZones": saveZones(); break;
    case "recInfo": sheetRecovery(el.dataset.date||todayStr()); break;
    case "sleepInfo": sheetSleep(el.dataset.date||todayStr()); break;
    case "acwrInfo": sheetAcwr(el.dataset.date||todayStr()); break;
    case "goRaces": st.view="grafics"; st.grTab="comp"; render(); window.scrollTo(0,0); break;
    case "grTab": st.grTab=el.dataset.t; render(); window.scrollTo(0,0); break;
    case "calM": { const [Y,M]=(st.calMonth||todayStr().slice(0,7)).split("-").map(Number); const d=new Date(Date.UTC(Y,M-1+Number(el.dataset.d),1)); st.calMonth=`${d.getUTCFullYear()}-${pad(d.getUTCMonth()+1)}`; render(); break; }
    case "calDay": st.planDay=el.dataset.date; st.view="avui"; render(); window.scrollTo(0,0); break;
    case "editRace": sheetRace(el.dataset.id||null); break;
    case "saveRace": saveRace(); break;
    case "delRace": { const id=sheetState.id; closeSheet(); write("races",id,null); toast("Competició eliminada"); break; }
    case "raceApprox": document.querySelector("#r-approx").classList.toggle("on"); break;
    case "actDetail": sheetDetail(el.dataset.id); break;
    case "pushCfg": sheetPush(); break;
    case "pushOn": pushOn(); break;
    case "pushOff": pushOff(); break;
    case "pushTest": pushTest(); break;
    case "cover": sheetPhoto("cover"); break;
    case "pickPhoto": pickPhoto(el.dataset.k==="cover"?"cover":"photo"); break;
    case "delPhoto": { const pr={...(st.profile||{})}; delete pr[el.dataset.k==="cover"?"cover":"photo"]; st.profile=pr; closeSheet(); write("profile",null,{}); toast("Foto treta"); break; }
    case "viewSelf": viewAthlete(null); break;
    case "invite": createInvite(); break;
    case "copyCode": { const msg=`Hola! Per connectar-te a Càrrega Tri: entra a https://marcal2004.github.io/carrega-tri/ , crea't un compte i ves a Jo › Configuració › Entrenador. Codi: ${el.dataset.code}`; navigator.clipboard?.writeText(msg).then(()=>toast("Missatge copiat"),()=>toast(el.dataset.code)); break; }
    case "coachLink": if(!st.myLink) sheetRedeem(); else toast("Ja estàs connectat amb el teu entrenador"); break;
    case "redeem": redeem(); break;
    case "athSettings": sheetAthlete(st.viewUid); break;
    case "saveAth": saveAth(); break;
    case "unlinkAth": unlinkAth().then(()=>viewAthlete(null)); break;
    case "importJson": { const inp=document.createElement("input"); inp.type="file"; inp.accept="application/json,.json"; inp.onchange=()=>inp.files[0]&&importJson(inp.files[0]); inp.click(); break; }
    case "pendAll": st.pendAll=!st.pendAll; render(); break;
    case "pickDay": st.planDay=el.dataset.date; render(); break;
    case "goToday": st.planDay=null; render(); window.scrollTo(0,0); break;
    case "dayWk": st.planDay=addD(st.planDay&&isDate(st.planDay)?st.planDay:todayStr(), Number(el.dataset.d)); render(); break;
    case "editDay": sheetDay(el.dataset.date); break;
    case "saveDay": saveDay(); break;
    case "editTest": sheetTest(el.dataset.id||null); break;
    case "saveTest": saveTest(); break;
    case "newWeight": sheetWeight(null); break;
    case "editWeight": sheetWeight(el.dataset.d); break;
    case "saveWeight": saveWeight(); break;
    case "settings": sheetSettings(); break;
    case "saveSettings": saveSettings(); break;
    case "editCoef": sheetCoef(); break;
    case "saveCoef": saveCoef(false); break;
    case "resetCoef": saveCoef(true); break;
    case "export": exportXlsx(); break;
    case "sync": syncGarmin(true); break;
    case "garminHelp": sheetGarminHelp(); break;
    case "askDel": {
      const k=sheetState?.kind;
      confirmDel(el, ()=>{ const s=sheetState; closeSheet();
        if(k==="sess"){ write("sessions",s.id,null); if(s.gid){ const ig=[...new Set([...(prof().garminIgnored||[]),s.gid])].slice(-300); write("profile",null,{...(st.profile||{}),garminIgnored:ig}); } }
        else if(k==="morning") write("daily",s.date,null);
        else if(k==="macro") write("macros",s.id,null);
        else if(k==="test") write("tests",s.id,null);
        else if(k==="day") write("dayplan",s.date,null);
        else if(k==="weight") write("weights",s.orig,null);
        toast("Esborrat"); });
      break; }
  }
});
document.addEventListener("keydown", e=>{ if(e.key==="Escape" && sheetState) closeSheet(); });

render();
setTimeout(boot, 0);
})();
</script>
